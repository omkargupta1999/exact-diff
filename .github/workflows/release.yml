name: Release

# Push a tag like v1.2.0 (created by `npm version minor`) to build and publish a release.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  web:
    name: Web app and single HTML file
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Check that the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: node scripts/build-web.mjs
      - name: Package
        run: |
          mkdir -p out
          cp dist/exact-diff.html "out/exact-diff-${GITHUB_REF_NAME}.html"
          (cd dist/web && zip -9 -r "../../out/exact-diff-${GITHUB_REF_NAME}-web.zip" .)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-web
          path: out/*
          if-no-files-found: error

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            args: --linux AppImage deb
          - name: Windows
            os: windows-latest
            args: --win nsis portable
          - name: macOS
            os: macos-latest
            args: --mac dmg --x64 --arm64
    defaults:
      run:
        working-directory: desktop
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # builds are unsigned unless you add signing secrets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run copy-app
      - run: npx electron-builder ${{ matrix.args }} --publish never
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-desktop-${{ matrix.name }}
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*-setup.exe
            desktop/dist/*-portable.exe
            desktop/dist/*.dmg
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [web, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write        # create the release
      id-token: write        # sign the provenance attestation
      attestations: write    # store it
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Build provenance (SLSA) for every file
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: release/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
