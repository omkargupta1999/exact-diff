version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      test-tools:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
    groups:
      electron:
        patterns: ['electron', 'electron-builder']
